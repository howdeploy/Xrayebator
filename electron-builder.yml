appId: com.xrayebator.gui
productName: Xrayebator
directories:
  buildResources: resources
  output: dist

files:
  - out/**
  - package.json

extraResources:
  - from: install.sh
    to: scripts/install.sh
  - from: xrayebator
    to: scripts/xrayebator
  - from: uninstall.sh
    to: scripts/uninstall.sh
  - from: resources/icons/icon.png
    to: icons/icon.png

publish:
  - provider: github
    owner: howdeploy
    repo: Xrayebator

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: resources/icons/icon.ico

mac:
  target:
    - target: dmg
      arch:
        - arm64
    - target: zip
      arch:
        - arm64
  icon: resources/icons/icon.png

linux:
  target:
    - target: AppImage
      arch:
        - x64
  category: Utility
  synopsis: Управление Xray Reality на VPS

nsis:
  oneClick: true
  allowToChangeInstallationDirectory: false
  perMachine: false

npmRebuild: true
