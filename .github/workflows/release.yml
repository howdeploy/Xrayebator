name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  typecheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  build:
    needs: [typecheck, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: macos-15
            platform: mac
          - os: ubuntu-24.04
            platform: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Linux system deps
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsecret-1-dev
      - run: npm ci
      - run: npm run build
      - name: Package
        run: npx electron-builder --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify packaged artifact
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.platform }}" in
            win) artifact=(dist/*-win.exe) ;;
            mac) artifact=(dist/*-mac-*.dmg dist/*-mac-*.zip) ;;
            linux) artifact=(dist/*-linux.AppImage) ;;
            *) echo "Unknown platform: ${{ matrix.platform }}" >&2; exit 2 ;;
          esac
          expected=1
          if [[ "${{ matrix.platform }}" == mac ]]; then
            expected=2
          fi
          if [[ "${#artifact[@]}" -ne "$expected" ]]; then
            echo "Expected $expected package(s) for ${{ matrix.platform }}" >&2
            printf 'Matches: %s\\n' "${artifact[@]}" >&2
            exit 1
          fi
          for file in "${artifact[@]}"; do
            if [[ ! -s "$file" ]]; then
              echo "Package is missing or empty: $file" >&2
              exit 1
            fi
            printf 'Verified package: %s (%s bytes)\\n' "$file" "$(wc -c < "$file")"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-package
          path: |
            dist/*-win.exe
            dist/*-mac-*.dmg
            dist/*-mac-*.zip
            dist/*-linux.AppImage
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-metadata
          path: dist/latest*.yml
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes_file="docs/releases/${GITHUB_REF_NAME}.md"
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists; updating target and uploading artifacts."
            gh release edit "${GITHUB_REF_NAME}" \
              --repo "${GITHUB_REPOSITORY}" \
              --target "${GITHUB_SHA}"
            while IFS= read -r asset_name; do
              case "$asset_name" in
                latest-linux.yml|latest-mac.yml|latest.yml|*-win.exe|*-mac-*.dmg|*-mac-*.zip|*-linux.AppImage) ;;
                *)
                  echo "Removing stale release asset: $asset_name"
                  gh release delete-asset "${GITHUB_REF_NAME}" "$asset_name" \
                    --repo "${GITHUB_REPOSITORY}" --yes
                  ;;
              esac
            done < <(gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" \
              --json assets --jq '.assets[].name')
            gh release upload "${GITHUB_REF_NAME}" artifacts/* \
              --repo "${GITHUB_REPOSITORY}" \
              --clobber
          elif [[ -f "$notes_file" ]]; then
            gh release create "${GITHUB_REF_NAME}" artifacts/* \
              --repo "${GITHUB_REPOSITORY}" \
              --target "${GITHUB_SHA}" \
              --title "Xrayebator ${GITHUB_REF_NAME}" \
              --notes-file "$notes_file"
          else
            gh release create "${GITHUB_REF_NAME}" artifacts/* \
              --repo "${GITHUB_REPOSITORY}" \
              --target "${GITHUB_SHA}" \
              --generate-notes
          fi
