name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  typecheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  build:
    needs: [typecheck, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: macos-15
            platform: mac
          - os: ubuntu-24.04
            platform: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Linux system deps
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsecret-1-dev
      - run: npm ci
      - run: npm run build
      - name: Package
        run: npx electron-builder --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify packaged artifact
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.platform }}" in
            win) artifact=(dist/*.exe) ;;
            mac) artifact=(dist/*.dmg) ;;
            linux) artifact=(dist/*.AppImage) ;;
            *) echo "Unknown platform: ${{ matrix.platform }}" >&2; exit 2 ;;
          esac
          if [[ "${#artifact[@]}" -ne 1 || ! -s "${artifact[0]}" ]]; then
            echo "Expected one non-empty package for ${{ matrix.platform }}" >&2
            printf 'Matches: %s\\n' "${artifact[@]}" >&2
            exit 1
          fi
          printf 'Verified package: %s (%s bytes)\\n' "${artifact[0]}" "$(wc -c < "${artifact[0]}")"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-package
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-metadata
          path: dist/latest*.yml
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes_file="docs/releases/${GITHUB_REF_NAME}.md"
          if [[ -f "$notes_file" ]]; then
            gh release create "${GITHUB_REF_NAME}" artifacts/* \
              --repo "${GITHUB_REPOSITORY}" \
              --target "${GITHUB_SHA}" \
              --title "Xrayebator ${GITHUB_REF_NAME}" \
              --notes-file "$notes_file"
          else
            gh release create "${GITHUB_REF_NAME}" artifacts/* \
              --repo "${GITHUB_REPOSITORY}" \
              --target "${GITHUB_SHA}" \
              --generate-notes
          fi
