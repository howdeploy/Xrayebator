name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Проверяет всё, что может обвалить релиз, ДО того как потратить ~15 минут на
  # три платформы: наличие текста релиза и способность токена публиковать
  # релизы от имени владельца. Иначе ошибка всплывает в самом последнем job.
  preflight:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check release notes exist
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          f="docs/releases/${GITHUB_REF_NAME}.en.md"
          if [[ ! -s "$f" ]]; then
            echo "::error::Нет текста релиза $f — создайте его до установки тега ${GITHUB_REF_NAME}."
            echo "Без файла релиз всё равно опубликуется, но с авто-сгенерированными notes вместо описания для пользователя."
            exit 1
          fi
          echo "Текст релиза: $(wc -c < "$f") байт"
      - name: Check publishing identity
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.AP3X0 }}
          CANDIDATE_SET: ${{ secrets.AP3X0 != '' }}
        run: |
          set -euo pipefail
          if [[ "$CANDIDATE_SET" != "true" ]]; then
            echo "::warning::Секрет AP3X0 не задан — релиз опубликует github-actions[bot], а не владелец аккаунта."
            exit 0
          fi
          probe="preflight-probe-${GITHUB_RUN_ID}"
          if ! gh release create "$probe" --repo "$GITHUB_REPOSITORY" --title "preflight probe" --draft --notes "проверка прав, черновик немедленно удалён" 2>/tmp/probe.err; then
            echo "::error::Токен AP3X0 не может создавать релизы: $(cat /tmp/probe.err)"
            echo "Выдайте PAT аккаунта Ap3x0s право Contents: Read and Write в howdeploy/Xrayebator (Settings → Secrets and variables → Actions → AP3X0), затем повторите тег."
            exit 1
          fi
          gh release delete "$probe" --repo "$GITHUB_REPOSITORY" --yes >/dev/null 2>&1 \
            || echo "::warning::Пробный черновик $probe не удалён — снесите вручную."
          echo "Логин токена: $(gh api user --jq .login) — релиз будет опубликован от этого аккаунта."

  typecheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libsecret-1-dev
      - run: npm ci
      - run: npm test

  build:
    needs: [preflight, typecheck, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: macos-15
            platform: mac
          - os: ubuntu-24.04
            platform: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Linux system deps
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsecret-1-dev
      - run: npm ci
      - run: npm run build
      - name: Package
        run: npx electron-builder --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify packaged artifact
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.platform }}" in
            win) artifact=(dist/*-win.exe) ;;
            mac) artifact=(dist/*-mac-*.dmg dist/*-mac-*.zip) ;;
            linux) artifact=(dist/*-linux.AppImage) ;;
            *) echo "Unknown platform: ${{ matrix.platform }}" >&2; exit 2 ;;
          esac
          expected=1
          if [[ "${{ matrix.platform }}" == mac ]]; then
            expected=2
          fi
          if [[ "${#artifact[@]}" -ne "$expected" ]]; then
            echo "Expected $expected package(s) for ${{ matrix.platform }}" >&2
            printf 'Matches: %s\\n' "${artifact[@]}" >&2
            exit 1
          fi
          for file in "${artifact[@]}"; do
            if [[ ! -s "$file" ]]; then
              echo "Package is missing or empty: $file" >&2
              exit 1
            fi
            printf 'Verified package: %s (%s bytes)\\n' "$file" "$(wc -c < "$file")"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-package
          path: |
            dist/*-win.exe
            dist/*-mac-*.dmg
            dist/*-mac-*.zip
            dist/*-linux.AppImage
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-metadata
          path: dist/latest*.yml
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish GitHub release
        # Автор релиза = владелец токена публикации: поле author в GitHub
        # неизменяемо, заданного ботом «переключить» на человека нельзя. Если в
        # репозитории есть секрет AP3X0 (PAT аккаунта Ap3x0s с Contents: write),
        # релиз выходит от его имени и preflight выше это уже проверил; без
        # секретов остаётся встроенный GITHUB_TOKEN и автор github-actions[bot].
        env:
          GH_TOKEN: ${{ secrets.AP3X0 != '' && secrets.AP3X0 || github.token }}
        run: |
          notes_file="docs/releases/${GITHUB_REF_NAME}.en.md"
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists; updating target and uploading artifacts."
            gh release edit "${GITHUB_REF_NAME}" \
              --repo "${GITHUB_REPOSITORY}" \
              --target "${GITHUB_SHA}" \
              --title "Xrayebator ${GITHUB_REF_NAME}" \
              --notes-file "$notes_file"
            while IFS= read -r asset_name; do
              case "$asset_name" in
                latest-linux.yml|latest-mac.yml|latest.yml|*-win.exe|*-mac-*.dmg|*-mac-*.zip|*-linux.AppImage) ;;
                *)
                  echo "Removing stale release asset: $asset_name"
                  gh release delete-asset "${GITHUB_REF_NAME}" "$asset_name" \
                    --repo "${GITHUB_REPOSITORY}" --yes
                  ;;
              esac
            done < <(gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" \
              --json assets --jq '.assets[].name')
            gh release upload "${GITHUB_REF_NAME}" artifacts/* \
              --repo "${GITHUB_REPOSITORY}" \
              --clobber
          elif [[ -f "$notes_file" ]]; then
            gh release create "${GITHUB_REF_NAME}" artifacts/* \
              --repo "${GITHUB_REPOSITORY}" \
              --target "${GITHUB_SHA}" \
              --title "Xrayebator ${GITHUB_REF_NAME}" \
              --notes-file "$notes_file"
          else
            gh release create "${GITHUB_REF_NAME}" artifacts/* \
              --repo "${GITHUB_REPOSITORY}" \
              --target "${GITHUB_SHA}" \
              --generate-notes
          fi
