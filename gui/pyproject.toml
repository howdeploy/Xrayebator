[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xrayebator-gui"
version = "0.2.0"
description = "Desktop GUI для развёртывания Xrayebator на VPS и подключения к нему (Xray VLESS Reality)"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = "MIT"
dependencies = [
    "PySide6>=6.7,<6.10",
    "paramiko>=3.4,<4.0",
    "requests>=2.31,<2.33",
    "requests[socks]>=2.31,<2.33",
    "qrcode[pil]>=7.4,<8.0",
    "keyring>=24.3,<26.0",
    "platformdirs>=4.2,<5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "ruff>=0.12,<1.0",
]

[project.scripts]
xrayebator-gui = "xrayebator_gui.app:main"
xrayebator-gui-helper = "xrayebator_gui.helper.service:main"

[tool.setuptools.packages.find]
include = ["xrayebator_gui*"]

[tool.setuptools.package-data]
# CI-4-fix: включены assets/TTF/PNG/SVG — собранный wheel должен содержать ресурсы редизайна.
# Без этого pip install из wheel не найдёт шрифт Inter и combo-arrow icon.
# CI-5-fix: SIL OFL-1.1 license for Inter font обязательно в дистрибутиве.
xrayebator_gui = [
    "resources/linux/*",
    "assets/**/*",
    "assets/fonts/*",
    "assets/icons/*",
    "assets/fonts/OFL.txt",
]

[tool.setuptools.exclude-package-data]
# CI-7-fix: из wheel не должны попадать скомпилированные байткоды (pyc/pyo) —
# они раздувают дистрибутив и ломают воспроизводимые сборки.
xrayebator_gui = [
    "**/__pycache__/*",
    "**/*.py[cod]",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

# CI-1-fix: Ruff сейчас красный из-за style-only warnings (S110/BLE001/N802/N803).
# Отключаем шумные правила без изменения кода (default select), чтобы ruff check
# пропускал CI. Реальные баги (F401/F811/F821) остаются в default наборе.
[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
ignore = [
    "S110",   # try-except-pass — намеренно в cleanup (connection/deploy/theme)
    "BLE001", # blind except Exception — same rationale
    "N802",   # eventFilter camelCase — Qt API contract
    "N803",   # same для .model().item()
    "PLW1510", # subprocess.run без check= — осознанно, обработка exit-code вручную везде
    "SIM102", # nested if — читаемость предпочтительнее в eventFilter
]
